<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Collection Catalog — OutfitAura</title>
    <meta name="description" content="Explore the full collection of minimalist-luxe fashion garments."/>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#70585b",
                        "primary-container": "#fadadd",
                        "on-primary-container": "#765e61",
                        "surface": "#fbf9f9",
                        "on-surface": "#1b1c1c",
                        "on-surface-variant": "#4f4445",
                    },
                    fontFamily: {
                        "serif": ["Playfair Display", "serif"],
                        "sans": ["DM Sans", "sans-serif"],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#fbf9f9] text-[#1b1c1c] font-sans antialiased min-h-screen flex flex-col selection:bg-[#fadadd] selection:text-[#765e61]">

    <!-- Top Navigation Bar -->
    <header class="bg-[#fbf9f9]/85 backdrop-blur-md sticky top-0 w-full z-40 border-b border-stone-200/60">
        <div class="flex justify-between items-center w-full px-6 md:px-16 max-w-7xl mx-auto h-20">
            <a href="/" class="font-serif text-2xl md:text-3xl tracking-tight text-[#1b1c1c] font-semibold hover:opacity-80 transition-opacity">
                OutfitAura
            </a>
            
            <nav class="hidden md:flex items-center gap-8 font-sans text-sm tracking-wide text-[#4f4445]">
                <a href="/" class="hover:text-[#70585b] transition-colors">Home</a>
                <a href="/shop.html?category=Women" class="hover:text-[#70585b] transition-colors" id="nav-women">Women</a>
                <a href="/shop.html?category=Men" class="hover:text-[#70585b] transition-colors" id="nav-men">Men</a>
                <a href="/shop.html?is_new_arrival=true" class="hover:text-[#70585b] transition-colors" id="nav-new">New Arrivals</a>
                <a href="/shop.html?is_trending=true" class="hover:text-[#70585b] transition-colors" id="nav-trending">Trending</a>
                <a href="/shop.html?is_sale=true" class="hover:text-[#70585b] transition-colors" id="nav-sale">Sale</a>
            </nav>

            <div class="flex items-center gap-4 text-[#1b1c1c]">
                <button data-open-cart aria-label="Shopping Bag" class="p-2 hover:text-[#70585b] transition-colors relative">
                    <span class="material-symbols-outlined">shopping_bag</span>
                    <span class="cart-badge absolute top-1 right-1 bg-[#1b1c1c] text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold" style="display: none;">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Page Header Banner -->
    <section class="bg-[#fadadd]/40 py-10 border-b border-stone-200/50">
        <div class="max-w-7xl mx-auto px-6 md:px-16 text-center">
            <span class="text-xs uppercase tracking-[0.2em] text-[#70585b] font-bold" id="page-subtitle">Atelier Catalog</span>
            <h1 class="font-serif text-3xl md:text-4xl font-bold text-[#1b1c1c] mt-1" id="page-title">Curated Collection</h1>
        </div>
    </section>

    <!-- Main Content: Filters + Product Grid -->
    <main class="max-w-7xl mx-auto px-6 md:px-16 py-10 flex-grow grid grid-cols-1 md:grid-cols-12 gap-8 w-full">
        <!-- Sidebar Filters -->
        <aside class="md:col-span-3 space-y-6">
            <!-- Search -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-2">Search Catalog</label>
                <div class="relative">
                    <input type="text" id="search-input" placeholder="e.g. Silk, Blazer, Coat" class="w-full pl-9 pr-3 py-2 text-xs rounded bg-stone-100 border-stone-300 focus:ring-1 focus:ring-stone-900 focus:outline-none">
                    <span class="material-symbols-outlined absolute left-2.5 top-2.5 text-stone-400 text-base">search</span>
                </div>
            </div>

            <!-- Categories Filter -->
            <div class="border-t border-stone-200 pt-5">
                <h3 class="text-xs font-bold uppercase tracking-wider text-stone-700 mb-3">Categories</h3>
                <div class="space-y-2 text-sm text-[#4f4445]" id="categories-filter">
                    <label class="flex items-center gap-2 cursor-pointer hover:text-stone-900">
                        <input type="radio" name="cat" value="" checked class="text-stone-900 focus:ring-0">
                        <span>All Collections</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer hover:text-stone-900">
                        <input type="radio" name="cat" value="Women" class="text-stone-900 focus:ring-0">
                        <span>Women</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer hover:text-stone-900">
                        <input type="radio" name="cat" value="Men" class="text-stone-900 focus:ring-0">
                        <span>Men</span>
                    </label>
                </div>
            </div>

            <!-- Size Filter -->
            <div class="border-t border-stone-200 pt-5">
                <h3 class="text-xs font-bold uppercase tracking-wider text-stone-700 mb-3">Size</h3>
                <div class="flex flex-wrap gap-2" id="size-chips">
                    <button class="size-chip px-3 py-1 text-xs border border-stone-300 rounded font-medium hover:border-stone-900" data-size="">All</button>
                    <button class="size-chip px-3 py-1 text-xs border border-stone-300 rounded font-medium hover:border-stone-900" data-size="XS">XS</button>
                    <button class="size-chip px-3 py-1 text-xs border border-stone-300 rounded font-medium hover:border-stone-900" data-size="S">S</button>
                    <button class="size-chip px-3 py-1 text-xs border border-stone-300 rounded font-medium hover:border-stone-900" data-size="M">M</button>
                    <button class="size-chip px-3 py-1 text-xs border border-stone-300 rounded font-medium hover:border-stone-900" data-size="L">L</button>
                    <button class="size-chip px-3 py-1 text-xs border border-stone-300 rounded font-medium hover:border-stone-900" data-size="XL">XL</button>
                </div>
            </div>

            <!-- Price Range -->
            <div class="border-t border-stone-200 pt-5">
                <h3 class="text-xs font-bold uppercase tracking-wider text-stone-700 mb-3">Price Range</h3>
                <div class="flex items-center gap-2">
                    <input type="number" id="min-price" placeholder="Min" class="w-1/2 px-2 py-1.5 text-xs rounded bg-stone-100 border-stone-300">
                    <span class="text-stone-400">-</span>
                    <input type="number" id="max-price" placeholder="Max" class="w-1/2 px-2 py-1.5 text-xs rounded bg-stone-100 border-stone-300">
                </div>
            </div>

            <button id="apply-filters" class="w-full bg-stone-900 text-white text-xs font-bold uppercase tracking-widest py-2.5 rounded hover:bg-stone-800 transition-colors">
                Apply Filters
            </button>
        </aside>

        <!-- Product Grid Area -->
        <section class="md:col-span-9">
            <!-- Toolbar -->
            <div class="flex justify-between items-center mb-6 pb-3 border-b border-stone-200">
                <span class="text-xs text-stone-500 font-medium" id="results-count">Loading collection...</span>
                <div class="flex items-center gap-2">
                    <label class="text-xs text-stone-500 font-medium">Sort by:</label>
                    <select id="sort-select" class="text-xs bg-transparent border-0 border-b border-stone-300 py-1 pl-0 pr-6 focus:ring-0 cursor-pointer">
                        <option value="newest">Newest Arrivals</option>
                        <option value="price_asc">Price: Low to High</option>
                        <option value="price_desc">Price: High to Low</option>
                        <option value="rating">Top Rated</option>
                    </select>
                </div>
            </div>

            <!-- Grid -->
            <div id="catalog-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Products loaded dynamically -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-stone-100 border-t border-stone-200 w-full py-12 mt-auto">
        <div class="max-w-7xl mx-auto px-6 md:px-16 text-center text-xs text-stone-500">
            <span class="font-serif text-lg font-bold text-[#1b1c1c] block mb-1">OutfitAura</span>
            <p>© 2024 OutfitAura Digital Atelier. Express Your Style.</p>
        </div>
    </footer>

    <!-- App Engine -->
    <script src="/js/app.js"></script>
    <script>
        let currentFilters = {
            category: '',
            size: '',
            search: '',
            min_price: '',
            max_price: '',
            sort_by: 'newest',
            is_new_arrival: '',
            is_trending: '',
            is_sale: ''
        };

        // Parse initial URL query params
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('category')) {
            currentFilters.category = urlParams.get('category');
            document.getElementById('page-title').textContent = `${currentFilters.category}'s Collection`;
            const radio = document.querySelector(`input[name="cat"][value="${currentFilters.category}"]`);
            if (radio) radio.checked = true;
        }
        if (urlParams.has('is_new_arrival')) {
            currentFilters.is_new_arrival = 'true';
            document.getElementById('page-title').textContent = 'New Arrivals';
        }
        if (urlParams.has('is_trending')) {
            currentFilters.is_trending = 'true';
            document.getElementById('page-title').textContent = 'Trending Styles';
        }
        if (urlParams.has('is_sale')) {
            currentFilters.is_sale = 'true';
            document.getElementById('page-title').textContent = 'Atelier Sale';
        }

        async function fetchProducts() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = `
                <div class="col-span-full py-16 text-center text-stone-400">
                    <span class="material-symbols-outlined text-4xl animate-spin">refresh</span>
                    <p class="mt-2 text-xs uppercase tracking-widest">Curating styles...</p>
                </div>
            `;

            let query = new URLSearchParams();
            if (currentFilters.category) query.append('category', currentFilters.category);
            if (currentFilters.size) query.append('size', currentFilters.size);
            if (currentFilters.search) query.append('search', currentFilters.search);
            if (currentFilters.min_price) query.append('min_price', currentFilters.min_price);
            if (currentFilters.max_price) query.append('max_price', currentFilters.max_price);
            if (currentFilters.sort_by) query.append('sort_by', currentFilters.sort_by);
            if (currentFilters.is_new_arrival) query.append('is_new_arrival', 'true');
            if (currentFilters.is_trending) query.append('is_trending', 'true');
            if (currentFilters.is_sale) query.append('is_sale', 'true');

            try {
                const res = await apiFetch(`/products?${query.toString()}`);
                document.getElementById('results-count').textContent = `${res.total} Pieces Available`;

                if (!res.products || res.products.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full py-16 text-center text-stone-500">
                            <span class="material-symbols-outlined text-5xl stroke-1 mb-2">style</span>
                            <p class="font-serif text-lg">No pieces found matching your criteria.</p>
                            <button onclick="resetFilters()" class="mt-4 text-xs uppercase font-bold tracking-widest text-[#70585b] border-b border-[#70585b] pb-0.5">Reset Filters</button>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = res.products.map(prod => `
                    <div class="group flex flex-col">
                        <div class="relative w-full aspect-[3/4] bg-stone-100 rounded-lg overflow-hidden mb-3">
                            <a href="/product.html?slug=${prod.slug}">
                                <img src="${prod.thumbnail || prod.images[0]}" 
                                     alt="${prod.name}" 
                                     class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                            </a>
                            <div class="absolute inset-x-0 bottom-0 p-3 opacity-0 group-hover:opacity-100 transition-all duration-300 bg-gradient-to-t from-black/40 to-transparent">
                                <button onclick="cartDrawer.addItem('${prod.id}', '${prod.sizes[0]}', '${prod.colors[0]?.name || 'Standard'}', 1)" 
                                        class="w-full bg-white text-stone-900 text-xs font-bold uppercase tracking-wider py-2.5 rounded shadow hover:bg-stone-100 transition-colors">
                                    Quick Add
                                </button>
                            </div>
                        </div>
                        <a href="/product.html?slug=${prod.slug}">
                            <h3 class="font-serif text-sm font-medium text-stone-900 truncate hover:text-[#70585b]">${prod.name}</h3>
                        </a>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-xs font-bold text-stone-700">$${prod.price.toFixed(2)}</span>
                            <span class="text-[10px] text-stone-400 uppercase tracking-wider">${prod.category}</span>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
                grid.innerHTML = `<p class="col-span-full text-red-600 text-center py-8">Failed to load catalog.</p>`;
            }
        }

        function resetFilters() {
            currentFilters = { sort_by: 'newest' };
            document.querySelectorAll('input[name="cat"]').forEach(r => r.checked = r.value === '');
            document.getElementById('search-input').value = '';
            document.getElementById('min-price').value = '';
            document.getElementById('max-price').value = '';
            fetchProducts();
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Category Radio
            document.querySelectorAll('input[name="cat"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    currentFilters.category = e.target.value;
                    fetchProducts();
                });
            });

            // Size Chips
            document.querySelectorAll('.size-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    document.querySelectorAll('.size-chip').forEach(c => c.classList.remove('bg-stone-900', 'text-white'));
                    chip.classList.add('bg-stone-900', 'text-white');
                    currentFilters.size = chip.dataset.size;
                    fetchProducts();
                });
            });

            // Sort Select
            document.getElementById('sort-select').addEventListener('change', (e) => {
                currentFilters.sort_by = e.target.value;
                fetchProducts();
            });

            // Apply Filters Button
            document.getElementById('apply-filters').addEventListener('click', () => {
                currentFilters.search = document.getElementById('search-input').value;
                currentFilters.min_price = document.getElementById('min-price').value;
                currentFilters.max_price = document.getElementById('max-price').value;
                fetchProducts();
            });

            fetchProducts();
        });
    </script>
</body>
</html>
